name: ep-register

services:
  ep-register-ui:
    image: ep-register-ui
    container_name: ep-register-ui
    restart: always
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        VITE_MODE: dev
    working_dir: /app
    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development
    ports:
      - "5173:5173" # Vite dev server
      - "8080:80" # optional: for nginx build container (if used)
    volumes:
      - ./:/app:cached
      - /app/node_modules
    command: sh -c "if [ ! -d node_modules ]; then npm ci --no-audit --no-fund; fi && npm run dev -- --host 0.0.0.0 --port 5173"
    stdin_open: true
    tty: true
    networks:
      - ep-register-net

networks:
  ep-register-net:
    external: true
    name: ep-register_ep-register-net
